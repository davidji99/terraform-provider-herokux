name: E2E Tests
on:
  push:
    branches: [master]
    paths:
      - 'api/**'
      - 'helper/**'
      - 'herokux/**'
      - 'go.mod'
      - 'go.sum'
      - 'GNUmakefile'
      - '.github/workflows/e2e.yml'
env:
  GOTOOLCHAIN: local

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - run: make build
      - name: Execute E2E tests
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKUX_ORGANIZATION: ${{ secrets.HEROKUX_ORGANIZATION }}
          HEROKUX_RUN_E2E_TESTS: 'true'
        run: |
          : "${HEROKU_API_KEY:?Set the HEROKU_API_KEY Actions secret}"
          : "${HEROKUX_ORGANIZATION:?Set the HEROKUX_ORGANIZATION Actions secret}"
          make testacc TEST="./herokux/" TESTARGS='-run=TestAccE2E'
