name: CodeQL
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 7 * * 6'

env:
  GOTOOLCHAIN: local

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@v4.39.3
        with:
          languages: go
          build-mode: manual
      - run: go build ./...
      - uses: github/codeql-action/analyze@v4.39.3
