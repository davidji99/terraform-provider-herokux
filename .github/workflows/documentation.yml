name: Documentation Checks
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - .markdownlinkcheck.json
      - .markdownlint.yml
      - .github/workflows/documentation.yml
      - docs/**

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check links in changed Markdown files
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          git diff --name-only -z --diff-filter=ACMRT "$BASE" HEAD -- ':(glob)docs/**/*.md' |
            xargs -0 -r npx --yes markdown-link-check@3.15.0 --quiet --verbose --config .markdownlinkcheck.json
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: avto-dev/markdown-lint@v1.5.0
        with:
          config: '.markdownlint.yml'
          args: 'docs'
