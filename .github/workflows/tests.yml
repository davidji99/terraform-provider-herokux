name: tests
on: [pull_request, push]
env:
  GOTOOLCHAIN: local

jobs:
  test:
    strategy:
      matrix:
        go-version: ['1.26.x', '1.27.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go vet ./...
      - name: Verify module files
        if: matrix.go-version == '1.26.x'
        run: go mod tidy -diff
      - name: Verify generated accessors
        working-directory: api
        run: go run gen-accessors.go && git diff --exit-code -- .
      - run: make build
      - run: make test
