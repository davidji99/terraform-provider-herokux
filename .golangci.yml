version: "2"
linters:
  default: none
  enable:
    - depguard
    - dogsled
    - govet
    - ineffassign
    - staticcheck
    - unused
  exclusions:
    rules:
      # Match the former varcheck and structcheck scope.
      - linters: [unused]
        text: '^(func|type) '
  settings:
    depguard:
      rules:
        logging:
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only by logutils.Log
    govet:
      enable:
        - shadow
    staticcheck:
      checks: ["S*", "SA*", "-ST*", "-SA1019"]
